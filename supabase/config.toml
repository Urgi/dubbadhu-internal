# Function JWT settings for the existing Dubbadhu Internal Supabase project.
# Deploy with: supabase functions deploy obsidian-chat obsidian-handoff obsidian-reply obsidian-purge-stale
# Do not put API keys here.

[functions.obsidian-chat]
verify_jwt = true

[functions.obsidian-handoff]
verify_jwt = true

# Ace POSTs here with ACE_OBSIDIAN_REPLY_KEY (not a Supabase user JWT).
[functions.obsidian-reply]
verify_jwt = false

# Cron posts OBSIDIAN_PURGE_SECRET (not a user JWT). See sql/obsidian_retention.sql.
[functions.obsidian-purge-stale]
verify_jwt = false

# Obsidian Team approvals: needs a signed-in admin user JWT (service_role is refused in code).
[functions.crew-decide]
verify_jwt = true

# Admin → MRR & burn live numbers: needs a signed-in admin user JWT (service_role is refused in code).
# Secrets: REVENUECAT_SECRET_KEY (v2, charts_metrics:overview:read + charts_metrics:charts:read), REVENUECAT_PROJECT_ID.
[functions.revenuecat-metrics]
verify_jwt = true
